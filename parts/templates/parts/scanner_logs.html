{% extends 'parts/base.html' %}
{% load static %}

{% block title %}Scanner Logs{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">
        <i class="fas fa-terminal me-2"></i>
        Scanner Logs - Últimas 200 líneas
      </h4>
    </div>
    <div class="card-body p-0">
      <div class="bg-dark text-light p-3" style="font-family: 'Courier New', monospace; font-size: 12px; max-height: 80vh; overflow-y: auto;">
        {% for log in logs %}
          <div class="mb-1">{{ log }}</div>
        {% empty %}
          <div class="text-muted">No hay logs disponibles</div>
        {% endfor %}
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-sm btn-primary" onclick="location.reload()">
        <i class="fas fa-sync-alt me-1"></i> Refrescar
      </button>
      <a href="{% url 'parts:scan_verify' %}" class="btn btn-sm btn-secondary">
        <i class="fas fa-arrow-left me-1"></i> Volver al Scanner
      </a>
    </div>
  </div>
</div>

<script>
  // Auto-refresh cada 5 segundos
  setTimeout(() => location.reload(), 5000);
</script>
{% endblock %}
