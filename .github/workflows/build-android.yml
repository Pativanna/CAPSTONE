name: Build Android APK

on:
  push:
    branches: [ main, master, traspaso-app ]
  pull_request:
    branches: [ main, master, traspaso-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Configure Android SDK path
      shell: bash
      run: |
        SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        if [ -z "$SDK_PATH" ]; then
          echo "Android SDK path not found in ANDROID_SDK_ROOT/ANDROID_HOME" >&2
          exit 1
        fi
        echo "sdk.dir=${SDK_PATH}" > android/local.properties
        cat android/local.properties
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Collect static files
      env:
        DEBUG: 'true'
        ALLOW_DEV_SECRET: 'true'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python manage.py collectstatic --noinput --clear
        
    - name: Remove compressed duplicates
      run: |
        find staticfiles -name "*.gz" -type f -delete
        echo "Removed compressed files to prevent duplicate assets"
        
    - name: Sync Capacitor
      run: |
        npx cap sync android
        
    - name: Inject MLKit plugin registration
      run: |
        node scripts/inject-mlkit-plugin.js
        cat android/app/src/main/assets/capacitor.plugins.json
        
    - name: Build Android APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: car-inventory-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Create Release (on tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
