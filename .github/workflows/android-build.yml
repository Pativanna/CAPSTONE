name: Build Android APK

on:
  push:
    branches: [ main, traspaso-app ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, traspaso-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Django static files
      env:
        ALLOW_DEV_SECRET: "true"
        DEBUG: "True"
        FORCE_SQLITE: "true"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput --clear
    
    - name: Copy index.html to staticfiles
      run: |
        cp car_inventory/static/index.html staticfiles/index.html
        echo "✓ Copied index.html to staticfiles/"
        ls -la staticfiles/index.html
    
    - name: Clean compressed files
      run: |
        find staticfiles -name "*.gz" -type f -delete
        echo "Removed compressed files to prevent duplicate assets"
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Grant execute permission for gradlew
      working-directory: android
      run: chmod +x gradlew
    
    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.run_number }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Create Release (on main branch)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          ## 📱 Car Inventory APK
          
          **Camera1 Scanner Implementation**
          - Escaneo continuo (loop infinito)
          - Layout 80/12/8
          - Performance optimizado 2x vs CameraX
          
          Build #${{ github.run_number }}
          Commit: ${{ github.sha }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
