{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario de Piezas</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome (iconos) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Tema custom -->
  <link href="{% static 'css/theme.css' %}" rel="stylesheet">
</head>
<body>

<!-- Navbar fija superior -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <span class="me-2">🚗</span>
      <span>Inventario</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <!-- Navegación futura en página principal; dejamos vacío por ahora -->
      <ul class="navbar-nav ms-auto"></ul>
    </div>
  </div>
  <div class="theme-toggle d-none"></div>
  <!-- espacio para futuros switches -->
  
</nav>

<!-- Contenido con padding-top para navbar fija -->
<main class="container py-4" style="padding-top: 5rem !important;">
  {% block content %}{% endblock %}
</main>

<!-- Toasts container -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
  <div id="toast-container" class="toast-container"></div>
  <!-- los toasts se inyectan aquí dinámicamente -->
  
</div>

<!-- Bootstrap JS (sin jQuery) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Utilidad global para toasts Bootstrap
  window.showToast = function({ title = 'Aviso', body = '', variant = 'primary', delay = 3000 } = {}) {
    try {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const id = 't' + Math.random().toString(36).slice(2);
      const headerClass = variant === 'danger' ? 'bg-danger text-white' :
                         variant === 'success' ? 'bg-success text-white' :
                         variant === 'warning' ? 'bg-warning' : 'bg-primary text-white';
      const toastEl = document.createElement('div');
      toastEl.className = 'toast align-items-center border-0 shadow';
      toastEl.id = id;
      toastEl.role = 'alert';
      toastEl.ariaLive = 'assertive';
      toastEl.ariaAtomic = 'true';
      toastEl.innerHTML = `
        <div class="toast-header ${headerClass}">
          <strong class="me-auto">${title}</strong>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">${body}</div>
      `;
      container.appendChild(toastEl);
      const toast = new bootstrap.Toast(toastEl, { delay });
      toast.show();
      toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    } catch (e) {
      console.error('Toast error:', e);
    }
  }
</script>

</body>
</html>
