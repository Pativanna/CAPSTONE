{% extends 'parts/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">
          <i class="fas fa-triangle-exclamation me-2"></i>
          Confirmar eliminación
        </h4>
      </div>
      <div class="card-body text-center py-5">
        <i class="fas fa-trash-alt fa-4x text-danger mb-4"></i>
        <h5 class="mb-4">¿Está seguro de eliminar la pieza?</h5>
        <p class="lead mb-4">
          <strong class="text-danger">"{{ part.name }}"</strong>
        </p>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
      </div>
      <div class="card-footer bg-light">
        <form method="post" class="d-flex gap-3 justify-content-center flex-wrap">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger btn-lg">
            <i class="fas fa-trash"></i> Sí, eliminar
          </button>
          <a href="{% url 'parts:part_list' %}" class="btn btn-secondary btn-lg">
            <i class="fas fa-times"></i> Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
